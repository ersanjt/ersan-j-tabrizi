    .language-gateway{min-height:100svh;display:grid;place-items:center;padding:clamp(24px,5vw,72px);background:var(--surface);color:var(--text)}

    .language-gateway-list a{min-height:104px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:22px;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);color:inherit;text-decoration:none;transition:background .2s,color .2s}.language-gateway-list a:hover,.language-gateway-list a:focus-visible,.language-gateway-list a.is-recommended{background:var(--accent);color:#0b0c0c}.language-gateway-list a>span{display:flex;align-items:center;gap:13px}.language-gateway-list strong{font-size:1.1rem}.language-gateway-list small{font-family:var(--mono);font-size:.72rem}
